<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>404 : Fear not Found</title>
<style>
  body {
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
  }
  iframe {
    border: none;
    width: 100%;
    max-width: 960px;
    height: 540px;
  }
</style>
</head>

<body>

<h1>Pour accéder au portefeuille de compétence : Cherchez l'ascenceur !</h1>

<!-- Ton jeu Scratch, mis à jour automatiquement -->
<iframe 
  src="https://turbowarp.org/1366469275/embed?fps=60&turbo&fullscreen"
  allowfullscreen>
</iframe>

<p>utilisez les touches ZQSD pour vous déplacer + la souris pour cliquer sur les boutons</p>
  
<script>
// Écoute les messages envoyés par Scratch
window.addEventListener("message", (event) => {

  if (event.data === "planchetendance") {
    window.open("https://drive.google.com/drive/folders/1sVer1C_hQuIVLbH2t9oJj-vvz-qYGuy1?hl=fr", "_blank");
  }

  if (event.data === "ouvrir_lien_B") {
    window.open("https://lienB.com", "_blank");
  }

  if (event.data === "ouvrir_lien_C") {
    window.open("https://lienC.com", "_blank");
  }

});
</script>

</body>
</html>
